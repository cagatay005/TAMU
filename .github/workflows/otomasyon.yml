name: TAMU Günlük Otomasyon

on:
  schedule:
    - cron: '0 3 * * *' # Türkiye saatiyle her sabah 06:00'da çalışır
  workflow_dispatch: # İstediğiniz zaman manuel çalıştırma butonu ekler

jobs:
  icerik_guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v3

      - name: Python Ortamını Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install google-generativeai

      - name: Python Motorunu (Gemini API) Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_news.py

      - name: Güncellenmiş Dosyayı Kaydet ve Siteye Gönder
        run: |
          git config --global user.name "TAMU Otomasyon"
          git config --global user.email "bot@tamu.com"
          git commit -am "Günlük içerik güncellendi" || exit 0
          git push
